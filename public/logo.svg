<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <g fill="#9b371f">
    <!-- Sunburst Rays -->
    <polygon points="200,10 193,65 207,65" />
    <polygon points="238,20 224,71 237,76" />
    <polygon points="274,38 253,85 264,92" />
    <polygon points="307,65 277,105 287,113" />
    <polygon points="333,101 295,130 302,140" />
    <polygon points="349,142 305,159 310,170" />
    
    <polygon points="162,20 176,71 163,76" />
    <polygon points="126,38 147,85 136,92" />
    <polygon points="93,65 123,105 113,113" />
    <polygon points="67,101 105,130 98,140" />
    <polygon points="51,142 95,159 90,170" />

    <!-- Main Sun Circle with Negative Space Planks and Text -->
    <path d="
      M 200,80 
      A 110,110 0 0,1 310,190 
      A 110,110 0 0,1 200,300 
      A 110,110 0 0,1 90,190 
      A 110,110 0 0,1 200,80 
      Z
    " />
  </g>

  <!-- Negative Space White Cuts: Wooden Planks Top -->
  <g fill="#ffffff">
    <rect x="135" y="115" width="18" height="50" rx="2" />
    <rect x="165" y="102" width="18" height="63" rx="2" />
    <rect x="195" y="98" width="18" height="67" rx="2" />
    <rect x="225" y="105" width="18" height="60" rx="2" />
    <rect x="255" y="125" width="18" height="40" rx="2" />
  </g>

  <!-- Logo Typography Inside Sun Disc -->
  <g fill="#ffffff" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900">
    <text x="200" y="212" font-size="28" letter-spacing="1">SWEDSWOOD</text>
    <text x="200" y="242" font-size="26" letter-spacing="1">ENTERPRISE</text>
  </g>

  <!-- Negative Space White Cuts: Wooden Planks Bottom Extension -->
  <g fill="#ffffff">
    <rect x="150" y="258" width="12" height="32" rx="1" />
    <rect x="175" y="258" width="12" height="38" rx="1" />
    <rect x="200" y="258" width="12" height="28" rx="1" />
    <rect x="225" y="258" width="12" height="36" rx="1" />
    <rect x="250" y="258" width="12" height="24" rx="1" />
  </g>
</svg>
